# Whisper Ledger Spring Boot Configuration
spring.application.name=whisper-ledger-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/whisper_ledger_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret & Expiration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Gemini AI (Optional)
gemini.api.key=${GEMINI_API_KEY:demo-key}
gemini.api.model=gemini-3.8-flash

# Logging
logging.level.com.whisperledger=DEBUG
logging.level.org.springframework.security=INFO
